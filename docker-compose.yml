services:
  api:
    build: ./services/api
    environment:
      CATALOG_MODE: demo
      RUNNER_MODE: simulate
      DATABASE_PATH: /data/planner.db
      ARTIFACT_ROOT: /data/artifacts
    volumes:
      - planner-data:/data
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  planner-data:
